<!doctype html><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@500;600;700&family=Manrope:wght@800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}
body{width:2500px;height:1686px;font-family:'IBM Plex Sans Thai',sans-serif;background:#071640}
.g{display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(2,1fr);width:2500px;height:1686px;gap:0}
.t{position:relative;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:30px;border:3px solid rgba(255,255,255,.10);overflow:hidden;color:#fff;text-align:center}
.t.p{background:linear-gradient(150deg,#2A66FF 0%,#1240C8 60%,#0B2E9E 100%)}
.t.d{background:linear-gradient(160deg,#0D2A78 0%,#0A1F5C 55%,#071640 100%)}
.t.o{background:linear-gradient(150deg,#FF9A3D 0%,#F06A1D 100%)}
.ic{width:230px;height:230px;border-radius:64px;display:grid;place-items:center;background:rgba(255,255,255,.14);box-shadow:inset 0 0 0 3px rgba(255,255,255,.22)}
.ic svg{width:130px;height:130px;fill:none;stroke:#fff;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
h2{font-size:92px;font-weight:700;line-height:1.1;letter-spacing:-.5px}
p{font-size:52px;font-weight:500;opacity:.82;line-height:1.2}
.n{position:absolute;top:44px;left:52px;font:800 46px Manrope;opacity:.35}
.tag{position:absolute;top:44px;right:52px;font-size:40px;font-weight:600;padding:8px 28px;border-radius:99px;background:#fff;color:#1240C8}
.t.o .tag{color:#E2600F}
</style>
<div class="g">
 <div class="t p"><span class="n">01</span>
  <div class="ic"><svg viewBox="0 0 24 24"><path d="M9 11l2 2 4-4"/><rect x="4" y="3" width="16" height="18" rx="3"/><path d="M8 17h8"/></svg></div>
  <h2>งานของฉัน</h2><p>สิ่งที่ต้องทำเดือนนี้</p></div>
 <div class="t o"><span class="n">02</span><span class="tag">ภายในวันที่ 5</span>
  <div class="ic"><svg viewBox="0 0 24 24"><path d="M14 3H7a3 3 0 0 0-3 3v12a3 3 0 0 0 3 3h10a3 3 0 0 0 3-3V9z"/><path d="M14 3v6h6"/><path d="M12 17v-6M9 14l3-3 3 3"/></svg></div>
  <h2>รายงานผล</h2><p>ส่งผลรายเดือน</p></div>
 <div class="t p"><span class="n">03</span>
  <div class="ic"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.2"/></svg></div>
  <h2>ภาพรวม</h2><p>คะแนนตัวชี้วัด</p></div>
 <div class="t d"><span class="n">04</span><span class="tag">ในแชต</span>
  <div class="ic"><svg viewBox="0 0 24 24"><path d="M4 19V9M10 19V5M16 19v-7M22 19H2"/></svg></div>
  <h2>สถานะของฉัน</h2><p>สรุปงานค้างทันที</p></div>
 <div class="t d"><span class="n">05</span><span class="tag">ในแชต</span>
  <div class="ic"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/><path d="M12 14v3l2 1"/></svg></div>
  <h2>กำหนดส่ง</h2><p>ปฏิทิน · ช่วงกรอกแผน</p></div>
 <div class="t d"><span class="n">06</span>
  <div class="ic"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.6.3-1 .8-1 1.5v.4"/><path d="M12 17h.01"/></svg></div>
  <h2>ช่วยเหลือ</h2><p>เชื่อมต่อบัญชี · ติดต่อ 343</p></div>
</div>
