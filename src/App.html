<script>
(function () {
'use strict';
/* ---------- ยูทิลิตี ---------- */
var M = ['ต.ค.', 'พ.ย.', 'ธ.ค.', 'ม.ค.', 'ก.พ.', 'มี.ค.', 'เม.ย.', 'พ.ค.', 'มิ.ย.', 'ก.ค.', 'ส.ค.', 'ก.ย.'];
var TM = ['ม.ค.', 'ก.พ.', 'มี.ค.', 'เม.ย.', 'พ.ค.', 'มิ.ย.', 'ก.ค.', 'ส.ค.', 'ก.ย.', 'ต.ค.', 'พ.ย.', 'ธ.ค.'];
var MAX_UPLOAD = 10 * 1024 * 1024;
function ico(n, c) { return '<svg class="ico ' + (c || '') + '" aria-hidden="true"><use href="#i-' + n + '"/></svg>'; }
function esc(s) { return String(s === null || s === undefined ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function f2(n) { return n === null || n === undefined || isNaN(n) ? '—' : Number(n).toFixed(2); }
function f4(n) { return n === null || n === undefined || isNaN(n) ? '—' : Number(n).toFixed(4); }
function pd(s) { if (!s) return null; var d = new Date(s.length === 10 ? s + 'T00:00:00' : s); return isNaN(d) ? null : d; }
function thD(s) { var d = typeof s === 'string' ? pd(s) : s; return d ? d.getDate() + ' ' + TM[d.getMonth()] + ' ' + (d.getFullYear() + 543) : '—'; }
function thDT(s) { var d = pd(s); if (!d) return '—'; return d.getDate() + ' ' + TM[d.getMonth()] + ' ' + String((d.getFullYear() + 543) % 100) + ' ' + ('0' + d.getHours()).slice(-2) + ':' + ('0' + d.getMinutes()).slice(-2); }
function fsize(b) { return !b ? '—' : b >= 1048576 ? (b / 1048576).toFixed(1) + ' MB' : Math.max(1, Math.round(b / 1024)) + ' KB'; }
function $(s) { return document.querySelector(s); }
function store(k, v) { try { if (v === undefined) return sessionStorage.getItem(k); if (v === null) sessionStorage.removeItem(k); else sessionStorage.setItem(k, v); } catch (e) { return null; } }

/* ---------- เรียกเซิร์ฟเวอร์ ---------- */
var TOKEN = store('cbe-token') || null;
function call(action, payload) {
  return new Promise(function (resolve, reject) {
    google.script.run
      .withSuccessHandler(function (r) {
        if (r && r.ok) return resolve(r.data);
        if (r && r.auth) { TOKEN = null; store('cbe-token', null); D = null; resetState(); renderLogin(r.error); }
        reject(new Error(r && r.error ? r.error : 'ไม่ได้รับคำตอบจากเซิร์ฟเวอร์'));
      })
      .withFailureHandler(function () { reject(new Error('เชื่อมต่อเซิร์ฟเวอร์ไม่ได้ กรุณาตรวจสอบอินเทอร์เน็ตแล้วลองใหม่')); })
      .api(TOKEN, action, payload || {});
  });
}
/** ปุ่มแสดงสถานะกำลังทำงานระหว่างรอเซิร์ฟเวอร์ และแสดงข้อผิดพลาดเป็น toast */
function busy(btn, p) {
  if (btn) { btn.classList.add('loading'); btn.disabled = true; }
  return p.then(function (v) { return v; }, function (e) { toast(e.message, true); throw e; })
    .finally(function () { if (btn) { btn.classList.remove('loading'); btn.disabled = false; } });
}

/* ---------- state ---------- */
var D = null; // ข้อมูลจาก bootstrap
var DET = {}; // รายละเอียดประเด็นย่อยที่โหลดแล้ว
var FILES = {}; // ไฟล์ของแต่ละตัวชี้วัด (คลังเอกสาร)
var USERS = null;
var st;
function resetState() { st = { view: 'overview', en: null, sub: null, lv: 0, qf: 'submitted', menu: false, ovEn: null, lib: [], libQ: '', tlEn: 'all', dirty: false }; DET = {}; FILES = {}; USERS = null; }
resetState();
var SUBS = [], ENm = {};

function index() {
  SUBS = []; ENm = {};
  D.enablers.forEach(function (e) {
    ENm[e.code] = e;
    e.topics.forEach(function (t) { t.subs.forEach(function (s) { s.e = e; s.t = t; SUBS.push(s); }); });
  });
}
function S(k) { for (var i = 0; i < SUBS.length; i++) if (SUBS[i].key === k) return SUBS[i]; return null; }
function isAdmin() { return D.me.role === 'admin'; }
function canEdit(code) { return !isAdmin() && D.me.enablers.indexOf(code) >= 0; }
function editableSt(s) { return s.status === 'draft' || s.status === 'returned'; }
function subsOf(e) { return SUBS.filter(function (s) { return s.e === e; }); }
function wavg(list, f) { var sw = 0, sv = 0; list.forEach(function (s) { var v = f(s); if (v !== null && v !== undefined) { sw += s.w; sv += v * s.w; } }); return sw ? sv / sw : null; }
function enScore(e) { return wavg(subsOf(e), function (s) { return s.self; }); }
function topicScore(t) { return wavg(t.subs, function (s) { return s.self; }); }
function sumW(e) { return subsOf(e).reduce(function (a, x) { return a + x.w; }, 0); }
function enStats(e) {
  var l = subsOf(e), x = { n: l.length, ok: 0, sub: 0, ret: 0, draft: 0, req: 0, have: 0, docs: 0, withDocs: 0, cm: 0, tl: 0 };
  l.forEach(function (s) {
    x[{ approved: 'ok', submitted: 'sub', returned: 'ret', draft: 'draft' }[s.status] || 'draft']++;
    x.req += s.req; x.have += s.reqHas; x.docs += s.docs; if (s.docs) x.withDocs++; x.cm += s.openCm; if (s.hasTl) x.tl++;
  });
  x.ev = x.req ? Math.round(x.have / x.req * 100) : null;
  return x;
}
function lvState(score, n) { return score === null || score === undefined ? 'none' : score >= n ? 'pass' : score > n - 1 ? 'part' : 'none'; }
var stTxt = { approved: 'ตรวจแล้ว', submitted: 'รอ กปม. ตรวจ', returned: 'ส่งกลับแก้ไข', draft: 'ร่าง' };
function statusPill(s) { return '<span class="pill ' + { approved: 'ok', submitted: 'info', returned: 'bad', draft: 'warn' }[s] + '">' + stTxt[s] + '</span>'; }
function tone(e) { var s = enScore(e); if (e.target === null || s === null) return 'idle'; return s >= e.target ? 'ok' : s >= e.target - 0.15 ? 'warn' : 'bad'; }
function vsTarget(e) { return { idle: '<span class="pill idle">ยังไม่มีเป้าหมาย/คะแนน</span>', ok: '<span class="pill ok">ถึงเป้า</span>', warn: '<span class="pill warn">ใกล้เป้า</span>', bad: '<span class="pill bad">ต่ำกว่าเป้า</span>' }[tone(e)]; }
function track(score, target, cls) {
  var p = score === null ? 0 : Math.min(score / 5 * 100, 100);
  return '<div class="track" role="img" aria-label="คะแนน ' + f2(score) + ' จาก 5' + (target !== null ? ' เป้าหมาย ' + f4(target) : '') + '"><div class="fill ' + (cls || '') + '" style="width:' + p + '%"></div>' + (target !== null ? '<div class="tick" style="left:calc(' + (target / 5 * 100) + '% - 1px)"></div>' : '') + '</div>';
}
function potGain(s) { return s.self === null ? 0 : (Math.floor(s.self) + 1 - s.self) * s.w / sumW(s.e); }
function actStatus(a) { var now = D.timeline.now; if (a.p >= 100) return 'done'; if (a.e < now) return 'late'; if (a.s > now) return 'wait'; return 'run'; }
var actTxt = { done: 'เสร็จแล้ว', late: 'ล่าช้า', wait: 'ยังไม่ถึงกำหนด', run: 'กำลังดำเนินการ' };
function tlMonth(i) { var fy = Number(D.timeline.fy); return M[i] + ' ' + String((i < 3 ? fy - 1 : fy) % 100); }
function rptMonth(i) { var fy = Number(D.settings.fy); return M[i] + ' ' + String((i < 3 ? fy - 1 : fy) % 100); }

/* ---------- หน้าเข้าสู่ระบบ ---------- */
function brand(sub) { return '<div class="brand"><img class="logo" src="' + LOGO + '" alt="CBE8 Core Business Enablers" width="210" height="82"><small>' + sub + '</small></div>'; }
function pwField(id, label, auto) {
  return '<div class="field"><label for="' + id + '">' + label + '</label><div class="pw-wrap"><input type="password" id="' + id + '" autocomplete="' + auto + '" maxlength="128" required><button type="button" data-pw="' + id + '" aria-label="แสดงรหัสผ่าน">' + ico('eye') + '</button></div></div>';
}
function renderLogin(msg) {
  $('#root').innerHTML = '<main class="login"><form class="login-card glass" id="loginForm" novalidate>' + brand('ระบบรายงานผล Core Business Enablers') +
    '<div><h1>เข้าสู่ระบบ</h1><p class="muted small">ใช้อีเมลและรหัสผ่านที่ได้รับจากกองประเมินผล</p></div>' +
    '<div class="notice bad" id="loginErr" role="alert"' + (msg ? '' : ' hidden') + '>' + ico('alert') + '<span>' + esc(msg || '') + '</span></div>' +
    '<div class="field"><label for="email">อีเมล</label><input type="email" id="email" autocomplete="username" inputmode="email" maxlength="200" required></div>' +
    pwField('password', 'รหัสผ่าน', 'current-password') +
    '<button class="btn primary" type="submit" id="loginBtn">เข้าสู่ระบบ</button>' +
    '<p class="foot">ลืมรหัสผ่านหรือบัญชีถูกล็อก ติดต่อผู้ดูแลระบบ กองประเมินผล</p></form></main>';
  $('#email').focus();
}
function loginErr(m) { var e = $('#loginErr'); e.hidden = false; e.querySelector('span').textContent = m; }
function doLogin() {
  var email = $('#email').value.trim(), pw = $('#password').value;
  if (!email || !pw) { loginErr('กรุณากรอกอีเมลและรหัสผ่าน'); (!email ? $('#email') : $('#password')).focus(); return; }
  var b = $('#loginBtn'); b.classList.add('loading'); b.disabled = true;
  call('login', { email: email, password: pw }).then(function (r) {
    TOKEN = r.token; store('cbe-token', TOKEN); load();
  }, function (e) { b.classList.remove('loading'); b.disabled = false; loginErr(e.message); $('#password').select(); });
}
function renderChangePw(forced) {
  var html = (forced ? '<div class="notice info">' + ico('lock') + '<span>เข้าสู่ระบบครั้งแรกด้วยรหัสผ่านชั่วคราว กรุณาตั้งรหัสผ่านใหม่ก่อนใช้งาน</span></div>' : '') +
    pwField('oldPw', 'รหัสผ่านปัจจุบัน', 'current-password') + pwField('newPw', 'รหัสผ่านใหม่', 'new-password') +
    '<span class="hint small muted">อย่างน้อย 10 ตัวอักษร มีทั้งตัวอักษรและตัวเลข</span>' + pwField('newPw2', 'ยืนยันรหัสผ่านใหม่', 'new-password') +
    '<span class="err" id="pwErr" hidden></span>';
  if (forced) {
    $('#root').innerHTML = '<main class="login"><form class="login-card glass" id="pwForm" novalidate>' + brand('ระบบรายงานผล Core Business Enablers') + '<h1>ตั้งรหัสผ่านใหม่</h1>' + html +
      '<button class="btn primary" type="submit" id="pwBtn">บันทึกรหัสผ่าน</button><button class="btn ghost" type="button" data-act="logout">ออกจากระบบ</button></form></main>';
    $('#oldPw').focus();
  } else {
    dialog('<h2>เปลี่ยนรหัสผ่าน</h2>' + html, { ok: 'บันทึกรหัสผ่าน', onOk: function (btn) { return savePw(btn); } });
  }
}
function savePw(btn) {
  var o = $('#oldPw').value, n = $('#newPw').value, n2 = $('#newPw2').value, err = $('#pwErr');
  var m = !o || !n ? 'กรุณากรอกให้ครบ' : n !== n2 ? 'รหัสผ่านใหม่ทั้งสองช่องไม่ตรงกัน' : n.length < 10 ? 'รหัสผ่านต้องยาวอย่างน้อย 10 ตัวอักษร' : !(/[A-Za-z]/.test(n) && /[0-9]/.test(n)) ? 'รหัสผ่านต้องมีทั้งตัวอักษรและตัวเลข' : '';
  if (m) { err.textContent = m; err.hidden = false; return Promise.reject(); }
  return busy(btn, call('changePassword', { oldPw: o, newPw: n })).then(function () { toast('เปลี่ยนรหัสผ่านแล้ว'); if (D && D.me.mustChange) load(); }, function (e) { err.textContent = e.message; err.hidden = false; throw e; });
}

/* ---------- โหลดข้อมูล ---------- */
function load(keepView) {
  return call('bootstrap').then(function (d) {
    D = d; index(); DET = {}; FILES = {};
    if (D.me.mustChange) return renderChangePw(true);
    if (!keepView) {
      try { var r = JSON.parse(store('cbe-view') || '{}'); if (r.uid === D.me.id) Object.assign(st, r.st); } catch (e) { /* ใช้ค่าเริ่มต้น */ }
    }
    shell(); render();
  }, function () { if (!TOKEN) renderLogin(); });
}
function refresh() { return call('bootstrap').then(function (d) { D = d; index(); render(); }); }
function saveView() { store('cbe-view', JSON.stringify({ uid: D.me.id, st: { view: st.view, en: st.en, sub: st.sub, lv: st.lv } })); }

/* ---------- โครงหน้า ---------- */
function shell() {
  $('#root').innerHTML = '<div class="app"><div class="scrim" id="scrim"></div><aside class="side glass" id="side" aria-label="เมนูหลัก"></aside><div class="main">' +
    '<header class="top glass"><button class="btn ghost sm menu-btn" id="menuBtn" aria-label="เปิดเมนู" aria-controls="side" aria-expanded="false">' + ico('menu') + '</button>' +
    '<div class="grow crumb" id="crumb"></div><div class="user"><span class="avatar" aria-hidden="true">' + esc(initials(D.me.name)) + '</span><span class="who" id="whoBox"></span>' +
    '<button class="btn icon ghost" data-act="changePw" aria-label="เปลี่ยนรหัสผ่าน" title="เปลี่ยนรหัสผ่าน">' + ico('lock') + '</button>' +
    '<button class="btn icon ghost" data-act="logout" aria-label="ออกจากระบบ" title="ออกจากระบบ">' + ico('logout') + '</button></div></header>' +
    '<main id="view" tabindex="-1"></main></div></div>';
}
function initials(n) { var p = String(n).replace(/^(นาย|นางสาว|นาง)\s*/, '').trim(); return p.slice(0, 2); }
function side() {
  var q = SUBS.filter(function (s) { return s.status === 'submitted'; }).length;
  var mine = SUBS.filter(function (s) { return s.status === 'returned' || s.status === 'draft'; }).length;
  function nav(v, label, icon, extra) { return '<button class="nav-btn" data-go="' + v + '"' + (st.view === v ? ' aria-current="page"' : '') + '>' + ico(icon) + '<span>' + label + '</span>' + (extra || '') + '</button>'; }
  return brand('ระบบรายงานผล · SE-AM ปีบัญชี ' + esc(D.settings.fy)) +
    nav('overview', 'ภาพรวม', 'home') +
    (isAdmin() ? nav('review', 'กล่องงานตรวจ', 'inbox', q ? '<span class="badge">' + q + '</span>' : '') : nav('mine', 'งานของฉัน', 'inbox', mine ? '<span class="badge">' + mine + '</span>' : '')) +
    nav('timeline', 'Timeline', 'gantt', D.timeline.isOpen && !isAdmin() ? '<span class="badge" style="background:var(--ok)" title="เปิดให้กรอก">•</span>' : '') +
    nav('library', 'คลังเอกสาร', 'folder') +
    '<div class="nav-label">' + (isAdmin() ? 'ตัวชี้วัดทั้งหมด' : 'ตัวชี้วัดที่รับผิดชอบ') + '</div>' +
    D.enablers.map(function (e) { return '<button class="nav-btn" data-en="' + e.code + '"' + (st.view === 'enabler' && st.en === e.code ? ' aria-current="page"' : '') + '><span class="code">' + e.code + '</span><span>' + esc(e.name) + '</span>' + (e.incomplete ? '<span class="badge" style="background:#D58A10" title="ข้อมูลในชีทต้นทางไม่สมบูรณ์">!</span>' : '') + '</button>'; }).join('') +
    '<div class="nav-label">ระบบ</div>' + (isAdmin() ? nav('users', 'ผู้ใช้งาน', 'user') + nav('settings', 'ตั้งค่าและนำเข้าข้อมูล', 'gear') : '') + nav('log', 'ประวัติการแก้ไข', 'clock') +
    '<div class="side-foot">รอบรายงานผล <b>' + rptMonth(D.settings.reportMonth) + '</b> · ปิดรับ ' + thD(D.settings.deadline) + '<br>Timeline ' + esc(D.timeline.fy) + ' เปิดกรอก ' + thD(D.timeline.open) + ' – ' + thD(D.timeline.close) + '<br>ติดต่อ ' + esc(D.settings.contact) + '</div>';
}
function crumb() {
  var e = ENm[st.en];
  var map = { overview: 'ภาพรวม', review: 'กล่องงานตรวจ', mine: 'งานของฉัน', users: 'ผู้ใช้งาน', settings: 'ตั้งค่าและนำเข้าข้อมูล', log: 'ประวัติการแก้ไข', library: 'คลังเอกสาร', timeline: 'Timeline ปีบัญชี ' + esc(D.timeline.fy), enabler: e ? 'ตัวชี้วัด ' + esc(e.no) + ' · ' + e.code : '' };
  return 'Core Business Enablers / <b>' + map[st.view] + '</b>';
}
function render() {
  if (!D) return;
  if (!isAdmin() && ['review', 'users', 'settings'].indexOf(st.view) >= 0) st.view = 'overview';
  if (isAdmin() && st.view === 'mine') st.view = 'review';
  if (st.view === 'enabler' && !ENm[st.en]) st.view = 'overview';
  $('#side').innerHTML = side(); $('#side').classList.toggle('open', st.menu); $('#scrim').classList.toggle('open', st.menu); $('#menuBtn').setAttribute('aria-expanded', st.menu);
  $('#crumb').innerHTML = crumb();
  $('#whoBox').innerHTML = '<b>' + esc(D.me.name) + '</b><br><span class="faint small">' + (isAdmin() ? 'แอดมิน / Audit' : 'ผู้รายงาน ' + esc(D.me.enablers.join(', '))) + '</span>';
  var V = { overview: isAdmin() ? vOverviewAdmin : vOverviewUser, enabler: vEnabler, review: vReview, mine: vMine, users: vUsers, settings: vSettings, log: vLog, library: vLibrary, timeline: vTimeline }[st.view];
  $('#view').innerHTML = V();
  saveView();
  if (st.view === 'enabler') ensureDetail();
  if (st.view === 'library') ensureFiles();
  if (st.view === 'users' && !USERS) call('listUsers').then(function (u) { USERS = u; if (st.view === 'users') render(); }, function (e) { toast(e.message, true); });
}
function go(v, extra) {
  if (st.dirty && !leaveOk()) return;
  Object.assign(st, { view: v }, extra || {}); st.menu = false; render();
  $('#view').focus({ preventScroll: true }); window.scrollTo({ top: 0, behavior: 'smooth' });
}
function leaveOk() { if (window.confirm) { try { return window.confirm('มีข้อมูลที่ยังไม่ได้บันทึก ต้องการออกจากหน้านี้หรือไม่'); } catch (e) { /* ไม่มี confirm */ } } return true; }

/* ---------- ภาพรวม ---------- */
function monthState(e, i) {
  if (i > D.settings.reportMonth) return 'future';
  var m = e.monthly; if (!m || !m.plan[i]) return 'none';
  return m.done[i] >= m.plan[i] ? 'approved' : m.done[i] > 0 ? 'late' : 'returned';
}
var heatLab = { approved: 'ผลครบตามแผน', late: 'ผลบางส่วน', returned: 'ยังไม่มีผล', none: 'ไม่มีแผน', future: 'ยังไม่ถึงรอบ' };
function heatmap(list) {
  return '<div class="panel glass"><div class="panel-head"><div><h2>ผลรายเดือนเทียบแผน</h2><p>จำนวนขั้นตอนที่มีผลถึงแผนในแต่ละเดือน ปีบัญชี ' + esc(D.settings.fy) + '</p></div><div class="legend">' +
    Object.keys(heatLab).map(function (k) { return '<span><i class="cell ' + (k === 'none' ? 'future' : k) + '" style="height:12px;width:12px"></i>' + heatLab[k] + '</span>'; }).join('') + '</div></div>' +
    '<div class="scroll-x"><table class="heat"><caption class="sr">ผลรายเดือนเทียบแผน</caption><thead><tr><th scope="col">ตัวชี้วัด</th>' + M.map(function (m, i) { return '<th scope="col">' + rptMonth(i) + '</th>'; }).join('') + '</tr></thead><tbody>' +
    list.map(function (e) {
      return '<tr><th scope="row" class="code">' + e.code + '</th>' + M.map(function (m, i) {
        var k = monthState(e, i), mm = e.monthly, txt = mm && mm.plan[i] ? mm.done[i] + '/' + mm.plan[i] : '';
        return '<td><div class="cell ' + (k === 'none' ? 'future' : k) + '" title="' + e.code + ' ' + m + ': ' + heatLab[k] + (txt ? ' (' + txt + ')' : '') + '">' + (k !== 'future' && k !== 'none' ? txt : '') + '<span class="sr">' + heatLab[k] + '</span></div></td>';
      }).join('') + '</tr>';
    }).join('') + '</tbody></table></div></div>';
}
function attention(list) {
  var items = [];
  list.forEach(function (e) {
    var t = tone(e), x = enStats(e);
    if (t === 'bad') items.push(['bad', 'target', e.code + ' ต่ำกว่าเป้า ' + f2(e.target - enScore(e)) + ' คะแนน', 'คะแนน ' + f2(enScore(e)) + ' เป้า ' + f4(e.target), 'en:' + e.code]);
    if (e.target === null) items.push(['warn', 'alert', e.code + ' ยังไม่มีคะแนนเป้าหมาย', 'กำหนดในหน้าตั้งค่า', isAdmin() ? 'go:settings' : 'en:' + e.code]);

    }
    case 'addReq': {
      var txt = $('#newReq').value.trim(); if (!txt) { $('#newReq').focus(); return; }
      busy(t, call('addRequirement', { key: s.key, level: st.lv + 1, text: txt })).then(afterSub);
      break;
    }
    case 'submit':
      if (st.dirty) { toast('กรุณากดบันทึกก่อนส่งตรวจ', true); return; }
      confirmDlg({ title: 'ส่ง ' + s.e.code + ' ' + esc(s.no) + ' ให้ กปม. ตรวจ', body: 'หลังส่ง ข้อมูลและไฟล์ของประเด็นนี้จะถูกล็อกจนกว่า กปม. จะตรวจเสร็จหรือส่งกลับ', ok: 'ส่งตรวจ' }, function (r, btn) { return busy(btn, call('submit', { key: s.key })).then(function () { toast('ส่งตรวจแล้ว'); return call('getSub', { key: s.key }).then(afterSub); }); });
      break;
    case 'approve': {
      var sc = $('#ascore').value, n = Number(sc);
      if (sc === '' || isNaN(n) || n < 0 || n > 5) { $('#aErr').hidden = false; $('#ascore').setAttribute('aria-invalid', 'true'); $('#ascore').focus(); return; }
      confirmDlg({ title: 'อนุมัติผล ' + s.e.code + ' ' + esc(s.no), body: 'บันทึกคะแนน กปม. ' + n.toFixed(2) + ' และล็อกข้อมูลของประเด็นนี้', ok: 'อนุมัติ' }, function (r, btn) { return busy(btn, call('approve', { key: s.key, score: n })).then(function () { toast('อนุมัติผลแล้ว'); return call('getSub', { key: s.key }).then(afterSub); }); });
      break;
    }
    case 'return':
    case 'unlock': {
      var un = ds.act === 'unlock';
      confirmDlg({ title: un ? 'ปลดล็อกให้แก้ไข' : 'ส่งกลับ ' + s.e.code + ' ' + esc(s.no) + ' ให้แก้ไข', body: 'ผู้รายงานจะแก้ไขข้อมูลได้อีกครั้ง เหตุผลจะถูกบันทึกเป็นข้อสังเกต', ok: un ? 'ปลดล็อก' : 'ส่งกลับแก้ไข', danger: true, needReason: true }, function (r, btn) {
        return busy(btn, call('returnSub', { key: s.key, reason: r, unlock: un })).then(function () { toast(un ? 'ปลดล็อกแล้ว' : 'ส่งกลับให้ผู้รายงานแล้ว'); return call('getSub', { key: s.key }).then(afterSub); });
      });
      break;
    }
    case 'comment': {
      var cm = $('#cmt'), cv = cm.value.trim();
      if (!cv) { $('#cmtErr').hidden = false; cm.setAttribute('aria-invalid', 'true'); cm.focus(); return; }
      busy(t, call('addComment', { key: s.key, text: cv })).then(function (c) { DET[s.key].comments = c; renderSub(); toast('ส่งข้อความแล้ว'); refresh(); });
      break;
    }
    case 'addAct': {
      var fm2 = actForm(null);
      dialog(fm2.html, { ok: 'เพิ่มกิจกรรม', onOk: function (btn) { return saveAct(null, btn); } });
      break;
    }
    case 'saveWin': {
      var o = $('#wOpen').value, cl = $('#wClose').value, fr = +$('#wFrom').value, to = +$('#wTo').value, we = $('#wErr');
      var msg = !o || !cl ? 'กรุณาระบุวันเปิดและปิด' : cl < o ? 'วันปิดรับต้องไม่ก่อนวันเปิด' : to < fr ? 'เดือนสิ้นสุดต้องไม่ก่อนเดือนเริ่ม' : '';
      if (msg) { we.textContent = msg; we.hidden = false; return; }
      busy(t, call('saveWindow', { open: o, close: cl, from: fr, to: to })).then(function () { toast('บันทึกช่วงเวลาแล้ว'); return refresh(); }, function (e) { we.textContent = e.message; we.hidden = false; });
      break;
    }
    case 'saveSettings':
      busy(t, call('saveSettings', { fy: $('#sFy').value.trim(), reportMonth: +$('#sMonth').value, deadline: $('#sDeadline').value, contact: $('#sContact').value })).then(function () { toast('บันทึกการตั้งค่าแล้ว'); return refresh(); });
      break;
    case 'import':
      confirmDlg({ title: 'นำเข้าข้อมูลจาก Google Sheet', body: $('#impOverwrite').checked ? 'ข้อมูลของประเด็นที่มีในระบบจะถูกแทนที่ด้วยข้อมูลจากชีท (ไฟล์ที่อัปโหลดแล้วยังอยู่)' : 'นำเข้าเฉพาะประเด็นที่ยังไม่มีข้อมูลในระบบ', ok: 'นำเข้า', danger: $('#impOverwrite').checked }, function (r, btn) {
        return busy(btn, call('importSheet', { overwrite: $('#impOverwrite').checked })).then(function (rep) {
          $('#impReport').innerHTML = '<ul class="report">' + rep.map(function (x) { return '<li><b class="code">' + x.code + '</b> ' + (x.error ? '<span class="no">' + esc(x.error) + '</span>' : 'นำเข้า ' + x.imported + ' ข้าม ' + x.skipped + (x.unknown.length ? ' · ไม่รู้จักประเด็น ' + esc(x.unknown.join(', ')) : '') + (x.warnings.length ? ' · ' + esc(x.warnings.join(', ')) : '')) + '</li>'; }).join('') + '</ul>';
          toast('นำเข้าเสร็จแล้ว'); DET = {}; return call('bootstrap').then(function (d) { D = d; index(); var keep = $('#impReport').innerHTML; render(); $('#impReport').innerHTML = keep; });
        });
      });
      break;
    case 'sync':
      busy(t, call('syncDrive')).then(function (r) {
        var html = '<p class="small" style="margin-top:10px">เพิ่มไฟล์ใหม่ ' + r.added + ' ไฟล์ · เชื่อมกับชื่อที่นำเข้า ' + r.linked + ' ไฟล์' + (r.missingFolders.length ? '<br><span class="no">ไม่พบโฟลเดอร์ของ ' + esc(r.missingFolders.join(', ')) + ' (ตรวจชื่อโฟลเดอร์หรือสิทธิ์ Drive)</span>' : '') + '</p>';
        FILES = {}; DET = {}; return call('bootstrap').then(function (d) { D = d; index(); render(); $('#syncReport').innerHTML = html; });
      });
      break;
  }
});
document.addEventListener('keydown', function (ev) {
  if ((ev.key === 'Enter' || ev.key === ' ') && ev.target.matches('tr[data-open],tr[data-en],[role="button"][data-lib]')) { ev.preventDefault(); ev.target.click(); }
  if (ev.key === 'Escape' && st.menu) { st.menu = false; render(); }
});
document.addEventListener('input', function (ev) {
  var el = ev.target;
  if (el.dataset.res !== undefined || el.id === 'narr') markDirty(true);
  if (el.dataset.res !== undefined) { var v = el.value.trim(); el.setAttribute('aria-invalid', v !== '' && (isNaN(Number(v)) || Number(v) < 0)); }
  if (el.id === 'narr') { var cc = $('#cc'); if (cc) cc.textContent = el.value.length + ' / 5000 ตัวอักษร'; }
  if (el.id === 'cmt' && el.value.trim()) { $('#cmtErr').hidden = true; el.removeAttribute('aria-invalid'); }
  if (el.id === 'ascore') { $('#aErr').hidden = true; el.removeAttribute('aria-invalid'); }
  if (el.id === 'fName' && el.value.trim()) { $('#eName').hidden = true; el.removeAttribute('aria-invalid'); }
  if (el.id === 'libq') { st.libQ = el.value; clearTimeout(el._t); el._t = setTimeout(function () { render(); var q = $('#libq'); q.focus(); q.setSelectionRange(q.value.length, q.value.length); }, 300); }
});
document.addEventListener('change', function (ev) {
  var el = ev.target;
  if (el.dataset.req !== undefined) markDirty(true);
  if (el.dataset.upl !== undefined && el.files.length) upload([].slice.call(el.files), st.sub, st.lv + 1, el.dataset.upl);
  if (el.dataset.libup && el.files.length) upload([].slice.call(el.files), st.lib[1], st.lib[2], '');
});
document.addEventListener('click', function (ev) { if (ev.target.id === 'scrim') { st.menu = false; render(); } });
window.addEventListener('beforeunload', function (ev) { if (st.dirty) { ev.preventDefault(); ev.returnValue = ''; } });

if (TOKEN) load(); else renderLogin();
})();
</script>
