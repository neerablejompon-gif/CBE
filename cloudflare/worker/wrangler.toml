# Worker API ของ CBE Reporting (เรียกจาก Pages ผ่าน service binding เท่านั้น)
name = "cbe-api"
main = "src/index.js"
compatibility_date = "2025-09-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = false
preview_urls = false

[vars]
# ID ของสเปรดชีตฐานข้อมูล (สร้างเองแล้วแชร์ให้ service account เป็น Editor) ตั้งผ่าน GitHub Actions หรือแก้ตรงนี้
DB_SPREADSHEET_ID = ""

# ความลับ ตั้งด้วย: wrangler secret put GOOGLE_SERVICE_ACCOUNT_JSON --config worker/wrangler.toml
# GOOGLE_SERVICE_ACCOUNT_JSON = เนื้อหาไฟล์ JSON key ของ service account

[[durable_objects.bindings]]
name = "CBE"
class_name = "CbeApi"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["CbeApi"]

[observability]
enabled = true
